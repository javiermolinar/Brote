name: Verify Debug Handover
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: go install github.com/go-delve/delve/cmd/dlv@v1.27.1
      - run: npm ci
      - run: npm run build && npm test
      - run: git diff --exit-code -- packages/web/public/app.js packages/vscode/dist/extension.js packages/vscode/dist/protocol.cjs
      - run: python3 scripts/test_install.py
      - run: go vet ./...
      - run: go test -race -v ./...
        env:
          DH_INTEGRATION: '1'
          CODEX_THREAD_ID: ''
      - run: npm run package:vscode
      - run: python3 scripts/package.py --include-vsix --output /tmp/debug-handover.zip
