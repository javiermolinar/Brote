name: Verify Debug Handover
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: go install github.com/go-delve/delve/cmd/dlv@v1.27.1
      - run: npm ci
      - run: npm run build && npm test
      - run: git diff --exit-code -- web/app.js vscode/dist/extension.js
      - run: go vet ./...
      - run: go test -race -v ./...
        env:
          DH_INTEGRATION: '1'
          CODEX_THREAD_ID: ''
      - run: npm exec --yes --package=@vscode/vsce@4.0.0 -- vsce package --no-dependencies --allow-missing-repository --skip-license --out debug-handover-0.1.0.vsix
        working-directory: vscode
      - run: python3 scripts/package.py --output /tmp/debug-handover.zip
