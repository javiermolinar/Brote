name: Verify Brote
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: go install github.com/go-delve/delve/cmd/dlv@v1.27.1
      - run: npm ci
      - run: npm run build && npm test
      - run: git diff --exit-code -- packages/web/public/app.js packages/vscode/dist/extension.js packages/vscode/dist/protocol.cjs
      - run: npm run test:packaging
      - name: Verify shared Brote tracing integration
        run: |
          go build -o bin/brote ./cmd/brote
          BROTE_CORE_INTEGRATION=1 node --test packages/client/test/core-tracing.test.cjs
      - run: go vet ./...
      - run: go test -race -v ./...
        env:
          DH_INTEGRATION: '1'
          CODEX_THREAD_ID: ''
      - run: npm run package:vscode
      - run: npm run test:packaging
        env:
          AGENTDEBUGGER_RELEASE_DIR: dist/releases
          AGENTDEBUGGER_TEST_PI: ${{ github.workspace }}/node_modules/.bin/pi
      - run: python3 scripts/package.py --include-vsix --output /tmp/debug-handover.zip
