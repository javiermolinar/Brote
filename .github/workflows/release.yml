name: Release bundles
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build && npm test
      - run: go install github.com/go-delve/delve/cmd/dlv@v1.27.1
      - name: Verify embedded Tempo durability
        run: |
          go build -o bin/brote ./cmd/brote
          BROTE_EMBEDDED_INTEGRATION=1 node --test packages/vscode/test/embedded-tempo.test.cjs
      - run: go test -race ./... && go vet ./...
        env:
          DH_INTEGRATION: '1'
          CODEX_THREAD_ID: ''
      - name: Build the three distribution formats
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          VSCODE_PUBLISHER: ${{ vars.VSCODE_PUBLISHER }}
          VSCODE_PUBLISH_ENABLED: ${{ vars.VSCODE_PUBLISH_ENABLED }}
          BROTE_NPM_NAME: ${{ vars.BROTE_NPM_NAME || vars.AGENTDEBUGGER_NPM_NAME }}
        run: sh scripts/build-release.sh
      - run: npm run test:packaging
        env:
          AGENTDEBUGGER_RELEASE_DIR: dist/releases
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dist/releases/*
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: dist/releases
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
        env:
          AGENTDEBUGGER_RELEASE_DIR: dist/releases
  marketplace:
    needs: [package, smoke]
    if: startsWith(github.ref, 'refs/tags/') && vars.VSCODE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: dist/releases
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify artifact identity and checksums
        env:
          VSCODE_PUBLISHER: ${{ vars.VSCODE_PUBLISHER }}
        run: |
          set -eu
          cd dist/releases
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('release-manifest.json').read_text())
          assert manifest['vscode'] == os.environ['VSCODE_PUBLISHER'] + '.brote'
          assert os.environ['VSCODE_PUBLISHER'] != 'brote-local'
          PY
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish tested VSIXs
        run: npm exec --yes --package=@vscode/vsce@4.0.0 -- vsce publish --azure-credential --packagePath dist/releases/*.vsix --skip-duplicate
  github-release:
    needs: [package, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: dist/releases
      - name: Publish GitHub tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" dist/releases/* --generate-notes
